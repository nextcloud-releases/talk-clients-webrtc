name: Build iOS WebRTC

on:
  workflow_dispatch:
    inputs:
      webrtc-branch:
        description: 'WebRTC branch (numeric)'
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: "26.5"

jobs:
  build:
    name: Build iOS WebRTC lib - Branch ${{ github.event.inputs.webrtc-branch }}
    runs-on: macos-26

    steps:
    - name: Checkout app
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: repo

    - name: Setup depot tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        readlink -f depot_tools >> $GITHUB_PATH
        # Since depot_tools d4e95894 fetch runs depot_tools' own python, which is only set up by the bootstrap.
        # Called by absolute path, with a relative one cipd looks for its files relative to the wrong directory.
        # $GITHUB_PATH only applies to later steps, the bootstrap needs depot_tools in PATH for luci-auth.
        export PATH="$(pwd)/depot_tools:$PATH"
        "$(pwd)/depot_tools/ensure_bootstrap"

    - name: Link python
      run: sudo ln -sf /Applications/Xcode.app/Contents/Developer/usr/bin/python3 /usr/local/bin/python

    - name: Setup Xcode ${{ env.XCODE_VERSION }}
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

#    - name: Install iOS 26.5
#      run: |
#        xcrun simctl list > /dev/null # Required to prevent the next command from sometimes not working
#        # xcodebuild -downloadPlatform iOS -buildVersion 26.5

    - name: Fetch WebRTC - Branch ${{ github.event.inputs.webrtc-branch }}
      run: |
        mkdir webrtc_ios && cd webrtc_ios
        fetch --nohooks webrtc_ios
        gclient sync
        cd src
        git checkout -b branch_${{ github.event.inputs.webrtc-branch }} branch-heads/${{ github.event.inputs.webrtc-branch }}
        gclient sync -D --no-history

    - name: Add Talk files and apply patches
      working-directory: webrtc_ios/src
      run: |
        echo "Copying files..."
        cp -R ${{ github.workspace }}/repo/ios/files/. .

        echo "Applying patches..."
        ls -ahl ${{ github.workspace }}/repo/ios/patches/*.patch
        find ${{ github.workspace }}/repo/ios/patches/ -name "*.patch" -print0 | xargs -0 -n 1 patch -p1 -i

    - name: Run Talk frame crypto tests
      working-directory: webrtc_ios/src
      run: |
        gn gen out/talk_tests --args='is_debug=false dcheck_always_on=true rtc_include_tests=true'
        autoninja -C out/talk_tests modules/talk_frame_crypto:talk_frame_crypto_unittests
        out/talk_tests/talk_frame_crypto_unittests

    - name: Build iOS WebRTC lib - Branch ${{ github.event.inputs.webrtc-branch }}
      working-directory: webrtc_ios/src/tools_webrtc/ios
      run: python build_ios_libs.py --arch "device:arm64" "simulator:arm64"

    # Create a zip file here as the ones created by the artifact step might be rejected by Xcode
    - name: Zip & generate checksum
      run: |
        cd webrtc_ios/src/out_ios_libs/
        zip -r WebRTC-${{ github.event.inputs.webrtc-branch }}.xcframework.zip WebRTC.xcframework
        echo "## iOS WebRTC lib - Branch ${{ github.event.inputs.webrtc-branch }}" >> $GITHUB_STEP_SUMMARY
        echo "Swift checksum: $(swift package compute-checksum WebRTC-${{ github.event.inputs.webrtc-branch }}.xcframework.zip)" >> $GITHUB_STEP_SUMMARY

    - name: Upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: webrtc_ios/src/out_ios_libs/WebRTC-${{ github.event.inputs.webrtc-branch }}.xcframework.zip
        archive: false
        retention-days: 4
