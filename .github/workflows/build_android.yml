name: Build Android WebRTC

on:
  workflow_dispatch:
    inputs:
      webrtc-branch:
        description: 'WebRTC branch (numeric)'
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android WebRTC lib - Branch ${{ github.event.inputs.webrtc-branch }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout app
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: repo

    - name: Setup depot tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        readlink -f depot_tools >> $GITHUB_PATH

    # From https://github.com/actions/runner-images/issues/10386
    - name: Remove unnecessary directories to free up space
      run: |
        df -h
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android/sdk/ndk
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        df -h      

    - name: Build Android WebRTC lib - Branch ${{ github.event.inputs.webrtc-branch }}
      run: |
        mkdir webrtc_android && cd webrtc_android
        fetch --nohooks webrtc_android
        gclient sync
        cd src
        git checkout -b branch_${{ github.event.inputs.webrtc-branch }} branch-heads/${{ github.event.inputs.webrtc-branch }}
        gclient sync -D --no-history

    - name: Add Talk files and apply patches
      working-directory: webrtc_android/src
      run: |
        echo "Copying files..."
        cp -R ${{ github.workspace }}/repo/files/. .
        cp -R ${{ github.workspace }}/repo/android/files/. .

        echo "Applying patches..."
        ls -ahl ${{ github.workspace }}/repo/patches/*.patch ${{ github.workspace }}/repo/android/patches/*.patch
        find ${{ github.workspace }}/repo/patches/ ${{ github.workspace }}/repo/android/patches/ -name "*.patch" -print0 | xargs -0 -n 1 patch -p1 -i

    - name: Run Talk frame crypto tests
      working-directory: webrtc_android/src
      run: |
        gn gen out/talk_tests --args='is_debug=false dcheck_always_on=true rtc_include_tests=true'
        autoninja -C out/talk_tests modules/talk_frame_crypto:talk_frame_crypto_unittests
        out/talk_tests/talk_frame_crypto_unittests

    - name: Build Android WebRTC lib - Branch ${{ github.event.inputs.webrtc-branch }}
      working-directory: webrtc_android/src
      run: |
        echo "Building..."
        tools_webrtc/android/build_aar.py

    - name: Upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: libwebrtc-${{ github.event.inputs.webrtc-branch }}.aar
        path: webrtc_android/src/libwebrtc.aar
        retention-days: 4
